name: Release ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make clang lld xorriso mtools git

      - name: Build kernel
        run: make TARGET=x86_64

      - name: Prepare Limine files
        run: make prepare-limine

      - name: Build ISO
        run: make iso TARGET=x86_64

      - name: Rename ISO with tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-manual}"
          cp build/x86_64/neoOS-x86_64.iso "build/x86_64/neoOS-${TAG_NAME}-x86_64.iso"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: neoOS-iso
          path: build/x86_64/neoOS-*-x86_64.iso

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/x86_64/neoOS-*-x86_64.iso
